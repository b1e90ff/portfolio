[package]
name    = "portfolio"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
description = "Personal portfolio of Niklas Tat"
publish = false

[[bin]]
name = "portfolio"
path = "src/main.rs"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"

[profile.dev]
opt-level = 0
debug     = 1

[dependencies]
axum   = { version = "0.8", features = ["macros", "tokio", "http2"] }
tokio  = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tower  = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = [
    "trace",
    "compression-full",
    "set-header",
    "fs",
    "timeout",
    "limit",
    "cors",
    "request-id",
    "catch-panic",
] }
hyper  = { version = "1", features = ["server"] }
http   = "1"

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"

thiserror = "2"
anyhow    = "1"

dotenvy = "0.15"
mime    = "0.3"
mime_guess = "2"

tokio-util = { version = "0.7", features = ["io"] }

lettre    = { version = "0.11", default-features = false, features = ["builder", "tokio1-rustls-tls", "smtp-transport", "hostname", "rustls-tls"] }
validator = { version = "0.20", features = ["derive"] }
parking_lot = "0.12"

maud   = { version = "0.27", features = ["axum"] }
chrono = { version = "0.4", features = ["clock", "serde"], default-features = false }
url    = "2"

resvg = { version = "0.47", default-features = false, features = ["text", "raster-images"] }

[dev-dependencies]
http-body-util = "0.1"
