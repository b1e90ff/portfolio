name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  semantic-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new-release-published: ${{ steps.release.outputs.new_release_published }}
      new-release-version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-edit
        run: cargo install --locked cargo-edit --version ^0.13
      - id: release
        uses: b1e90ff/action-semantic-release@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ github.event.inputs.dry_run }}

  docker:
    needs: [test, semantic-release]
    if: ${{ needs.semantic-release.outputs.new-release-published == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.semantic-release.outputs.new-release-version }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.semantic-release.outputs.new-release-version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.semantic-release.outputs.new-release-version }}
            type=semver,pattern={{major}},value=${{ needs.semantic-release.outputs.new-release-version }}
            type=raw,value=latest
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync-helm-chart:
    needs: [test, semantic-release, docker]
    if: ${{ needs.semantic-release.outputs.new-release-published == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.semantic-release.outputs.new-release-version }}
    steps:
      - name: Generate app token for helm-repository
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: b1e90ff
          repositories: helm-repository
      - uses: actions/checkout@v4
        with:
          repository: b1e90ff/helm-repository
          token: ${{ steps.app-token.outputs.token }}
          path: helm-repository
      - name: Bump portfolio-service chart
        working-directory: helm-repository
        run: |
          yq -i ".version = \"${VERSION}\"" portfolio-service/Chart.yaml
          yq -i ".appVersion = \"${VERSION}\"" portfolio-service/Chart.yaml
          yq -i ".\"web-service\".image.tag = \"${VERSION}\"" portfolio-service/values.yaml
      - name: Commit and push
        working-directory: helm-repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-service/Chart.yaml portfolio-service/values.yaml
          if git diff --cached --quiet; then
            echo "no chart changes to commit"
            exit 0
          fi
          git commit -m "feat(portfolio-service): sync chart and image to portfolio v${VERSION}"
          git push origin main
