name: audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-audit
      - id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          cargo audit --deny warnings --color never 2>&1 | tee audit.log
      - name: Open tracking issue
        if: steps.audit.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: cargo audit reports advisories on main
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --state open --search "$TITLE in:title" --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$open" ]; then
            gh issue create --title "$TITLE" --body "$(printf '%s\n\n```\n%s\n```\n' "$RUN_URL" "$(cat audit.log)")"
          fi
      - if: steps.audit.outcome == 'failure'
        run: exit 1
